{% extends "base.html" %}{% block content %}
<h1>Meet through words first</h1>
<p class="muted">No photos until you've both written, and both agree.</p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
<label>Email<input type="email" name="email" required autocomplete="email"></label>
<label>Display name<input name="display_name" maxlength="50" required></label>
<label>Password (10+ characters)<input type="password" name="password" minlength="10" required autocomplete="new-password"></label>
<button>Create account</button></form>
{% endblock %}
